[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infernet"
version = "0.1.0"
description = "Share local AI agents (OpenClaw, Ollama, custom) over libp2p"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "libp2p>=0.6.0",
  "multiaddr>=0.0.11",
  "trio>=0.26.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "web3>=6.0",
  "eth-account>=0.10",
]

[project.optional-dependencies]
bridge = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
infernet = "infernet.cli:main"
infernet-gateway = "infernet.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["infernet"]
